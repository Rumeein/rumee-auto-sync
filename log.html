<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumee — Sync Log</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #c9d1d9;
      min-width: 780px;
    }

    /* ── Header ── */
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 15px; font-weight: 600; color: #e6edf3; }
    .header .subtitle { color: #8b949e; font-size: 12px; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }

    /* ── Toolbar ── */
    .toolbar {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      flex-wrap: wrap;
    }
    .toolbar label { color: #8b949e; font-size: 12px; }
    .toolbar select, .toolbar input {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
    }
    .toolbar select:focus, .toolbar input:focus { border-color: #58a6ff; }
    #entryCount { color: #8b949e; font-size: 12px; margin-left: auto; }

    /* ── Buttons ── */
    .btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .btn--primary   { background: #238636; border-color: #2ea043; color: #fff; }
    .btn--secondary { background: #21262d; color: #c9d1d9; }
    .btn--danger    { background: #b62324; border-color: #b62324; color: #fff; }
    .btn:hover { opacity: 0.85; }

    /* ── Log table ── */
    .log-wrap { padding: 16px 20px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th {
      text-align: left;
      padding: 6px 10px;
      background: #161b22;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
      position: sticky;
      top: 88px; /* header + toolbar height */
      z-index: 5;
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      padding: 7px 10px;
      border-bottom: 1px solid #21262d;
      vertical-align: top;
    }
    tr:hover td { background: #161b22; }

    /* ── Level badges ── */
    .level {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .level--success { background: #1a3a2a; color: #3fb950; border: 1px solid #2ea043; }
    .level--info    { background: #1c2d3a; color: #58a6ff; border: 1px solid #1f6feb; }
    .level--warn    { background: #3a2e1a; color: #e3b341; border: 1px solid #9e6a03; }
    .level--error   { background: #3a1a1a; color: #ff7b72; border: 1px solid #b62324; }

    /* ── Job badge ── */
    .job-id {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      background: #21262d;
      color: #c9d1d9;
      white-space: nowrap;
    }

    /* ── Timestamp ── */
    .ts { color: #8b949e; white-space: nowrap; font-family: monospace; font-size: 11px; }

    /* ── Message ── */
    .msg { color: #e6edf3; line-height: 1.5; word-break: break-word; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
    }
    .empty .icon { font-size: 36px; margin-bottom: 12px; }
    .empty p { font-size: 13px; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>RUMEE — Sync Log</h1>
    <div class="subtitle">Persistent record of all job runs, uploads, and errors</div>
  </div>
  <div class="header-actions">
    <button class="btn btn--primary"    id="exportBtn">⬇ Export CSV</button>
    <button class="btn btn--secondary"  id="refreshBtn">↺ Refresh</button>
    <button class="btn btn--danger"     id="clearBtn">✕ Clear Log</button>
  </div>
</div>

<div class="toolbar">
  <label for="levelFilter">Level</label>
  <select id="levelFilter">
    <option value="">All levels</option>
    <option value="error">Error</option>
    <option value="warn">Warning</option>
    <option value="success">Success</option>
    <option value="info">Info</option>
  </select>

  <label for="jobFilter">Job</label>
  <select id="jobFilter">
    <option value="">All jobs</option>
  </select>

  <label for="search">Search</label>
  <input type="text" id="search" placeholder="filter message…" style="width:220px">

  <span id="entryCount">— entries</span>
</div>

<div class="log-wrap">
  <table id="logTable">
    <thead>
      <tr>
        <th style="width:160px">Timestamp</th>
        <th style="width:130px">Job</th>
        <th style="width:80px">Level</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
  <div class="empty hidden" id="emptyState">
    <div class="icon">📋</div>
    <p>No log entries yet.<br>Run a sync to start recording.</p>
  </div>
</div>

<script src="ist-time.js"></script>
<script src="config.js"></script>
<script src="logger.js"></script>
<script>
  let allEntries = [];

  // ── Load entries ────────────────────────────────────────────────────────────

  async function loadEntries() {
    allEntries = await readLog(); // newest first
    populateJobFilter();
    render();
  }

  function populateJobFilter() {
    const seen = new Set(allEntries.map(e => e.jobId));
    const sel = document.getElementById('jobFilter');
    // Keep the "All jobs" option, rebuild the rest
    while (sel.options.length > 1) sel.remove(1);
    [...seen].sort().forEach(id => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = id;
      sel.appendChild(opt);
    });
  }

  // ── Render ──────────────────────────────────────────────────────────────────

  function render() {
    const levelFilter = document.getElementById('levelFilter').value;
    const jobFilter   = document.getElementById('jobFilter').value;
    const search      = document.getElementById('search').value.toLowerCase();

    const filtered = allEntries.filter(e => {
      if (levelFilter && e.level !== levelFilter) return false;
      if (jobFilter   && e.jobId !== jobFilter)   return false;
      if (search      && !e.msg.toLowerCase().includes(search) && !e.jobId.includes(search)) return false;
      return true;
    });

    document.getElementById('entryCount').textContent = `${filtered.length} of ${allEntries.length} entries`;

    const tbody = document.getElementById('logBody');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      document.getElementById('emptyState').classList.remove('hidden');
      document.getElementById('logTable').style.display = 'none';
    } else {
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('logTable').style.display = '';

      filtered.forEach(e => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="ts">${formatTs(e.ts)}</td>
          <td><span class="job-id">${e.jobId || '—'}</span></td>
          <td><span class="level level--${e.level}">${e.level}</span></td>
          <td class="msg">${escHtml(e.msg)}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────

  function formatTs(isoStr) {
    try {
      return istDisplayString(isoStr);
    } catch { return isoStr; }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── Export CSV ──────────────────────────────────────────────────────────────

  function exportCsv() {
    const header = 'Timestamp,Job,Level,Message';
    const rows = allEntries.map(e =>
      [e.ts, e.jobId, e.level, `"${e.msg.replace(/"/g, '""')}"`].join(',')
    );
    const csv = [header, ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rumee_log_${istToday()}.csv`;
    a.click();
  }

  // ── Clear log ───────────────────────────────────────────────────────────────

  async function clearLogAndReload() {
    if (!confirm('Clear all log entries? This cannot be undone.')) return;
    await clearLog();
    allEntries = [];
    render();
  }

  // ── Wire up controls ────────────────────────────────────────────────────────

  document.getElementById('refreshBtn').addEventListener('click', loadEntries);
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('clearBtn').addEventListener('click', clearLogAndReload);

  document.getElementById('levelFilter').addEventListener('change', render);
  document.getElementById('jobFilter').addEventListener('change', render);
  document.getElementById('search').addEventListener('input', render);

  // Initial load
  loadEntries();

  // Auto-refresh every 10 seconds while the page is open
  setInterval(loadEntries, 10000);
</script>

</body>
</html>
