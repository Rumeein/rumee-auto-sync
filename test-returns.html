<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FK Returns — Direct Download Test</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #1a1a1a; color: #e0e0e0; margin: 0; }
    h2  { color: #90caf9; margin: 0 0 6px; }
    p   { color: #aaa; margin: 0 0 16px; font-size: 13px; }
    label { color: #ccc; font-size: 13px; }
    input[type="date"] {
      background: #222; color: #e0e0e0; border: 1px solid #444;
      padding: 4px 8px; border-radius: 4px; font-family: monospace;
      font-size: 13px; margin: 0 10px 0 4px;
    }
    button { padding: 8px 20px; margin: 0 6px 0 0; cursor: pointer; border: none;
             border-radius: 4px; font-size: 14px; font-family: monospace; }
    button:disabled { opacity: 0.4; cursor: default; }
    #runBtn  { background: #2196f3; color: white; }
    #stopBtn { background: #f44336; color: white; }
    .controls { margin-bottom: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    table { border-collapse: collapse; width: 740px; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px 12px; text-align: left; font-size: 13px; }
    th { background: #222; color: #90caf9; }
    tr:hover td { background: #1e1e1e; }
    .done    { color: #4caf50; font-weight: bold; }
    .error   { color: #f44336; font-weight: bold; }
    .running { color: #64b5f6; }
    .waiting { color: #555; }
    #log { margin-top: 16px; background: #111; padding: 10px; height: 180px; overflow-y: auto;
           font-size: 12px; color: #888; border: 1px solid #333; width: 728px; }
    #summary { margin-top: 14px; font-size: 13px; color: #ccc; min-height: 18px; }
  </style>
</head>
<body>
  <h2>FK Returns — Direct Download Test</h2>
  <p>Downloads from All Returns → Date of Closure filter (not Report Centre).<br>
     Do not run daily sync while this is active. FK caps report requests at 20/day across all types —
     this range is 13 dates, leaving headroom for the day's regular sync.</p>

  <div class="controls">
    <label>From: <input type="date" id="fromDate" value="2026-06-01"></label>
    <label>To:   <input type="date" id="toDate"   value="2026-06-13"></label>
    <button id="runBtn">Run Test</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <table>
    <thead>
      <tr><th>Date</th><th>Status</th><th>Size</th><th>Detail</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="summary"></div>
  <div id="log"></div>

  <script src="ist-time.js"></script>
  <script src="test-returns.js"></script>
</body>
</html>
